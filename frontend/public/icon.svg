<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00164D" />
      <stop offset="100%" stop-color="#00061A" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="50%" stop-color="#0092FF" />
      <stop offset="100%" stop-color="#002060" />
    </linearGradient>

    <!-- Text / Symbol Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Cyan Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="100%" stop-color="#0092FF" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0092FF" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="128" cy="128" r="80" fill="#0092FF" opacity="0.15" filter="blur(20px)" />

  <!-- Monogram RT -->
  <g filter="url(#glow)">
    <!-- Letter R -->
    <path d="M 58 74 L 112 74 C 132 74 144 84 144 102 C 144 116 135 125 120 128 L 148 182 L 122 182 L 98 134 L 84 134 L 84 182 L 58 182 Z M 84 94 L 84 116 L 108 116 C 118 116 123 111 123 105 C 123 99 118 94 108 94 Z" fill="url(#textGrad)" />

    <!-- Letter T (with stylized modern top bar) -->
    <path d="M 140 74 L 202 74 L 202 94 L 184 94 L 184 182 L 158 182 L 158 94 L 140 94 Z" fill="url(#textGrad)" />

    <!-- Modern Cyan Accent Dot / Spark -->
    <circle cx="202" cy="74" r="7" fill="url(#sparkGrad)" />
  </g>
</svg>
